<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 20 - manipulação de DOM</title>
</head>

<body>
    <input type="text" id="entrada" onkeyup="letraNumero()">
    <hr>
    <input type="text" id="Letra" disabled="disabled">
    <input type="text" id="Numero" disabled="disabled">
    <script>
        function letraNumero() {
            var ent = document.getElementById("entrada").value;
            if (ent == "1" || ent == "2" || ent == "3" || ent == "4" || ent == "5" || ent == "6" || ent == "7" || ent == "8" || ent == "9" || ent == "0") {
                document.getElementById("Numero").value = ent;
            } else {
                document.getElementById("Letra").value = ent;

            }
           document.getElementById("entrada").value = null;
        }
    </script>
</body>

</html>
