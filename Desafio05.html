<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
</head>

<body onload = myFunction()>
    <h1>Banco Digital - Terminal Seguro</h1>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
       ></script>

    <div class="mb-3">
        <label for="exampleFormControlInput1" class="form-label"></label>
        <input onkeyup="digitou()" type="email" class="form-control" id="exampleFormControlInput1"
            placeholder="Digite sua senha de 4 dígitos">
    </div>
    <div class="mb-3">
        <label for="exampleFormControlTextarea1" class="form-label"></label>
        <textarea class="form-control" id="exampleFormControlTextarea1" rows="1"></textarea>
    </div>

    <button onclick="acao()" type="button" class="btn btn-primary">Confirmar operação</button>


   
    <script>
        function acao() {
            alert("Processando transação... Por favor, aguarde.");
        }

        function digitou() {
            console.log("Usuário Digitou");
        }

        window.onbeforeunload = function (event) {
            event.preventDefault();
            event.returnValue = "";
        };
         function myFunction() {
       alert("Caixa eletrônico Pronto para uso! Digite seus dados com segurança.");
    }
    </script>
 
</body>

</html>
